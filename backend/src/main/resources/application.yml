spring:
  application:
    name: backend

  mvc:
    problem-details:
      enabled: true

  modulith:
    runtime:
      verification-enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/root_ia_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:tu-client-id-google}
            client-secret: ${GOOGLE_CLIENT_SECRET:tu-client-secret-google}
            scope: email, profile
          github:
            client-id: ${GITHUB_CLIENT_ID:tu-client-id-github}
            client-secret: ${GITHUB_CLIENT_SECRET:tu-client-secret-github}
            scope: user:email, read:user
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:tu-client-id-linkedin}
            client-secret: ${LINKEDIN_CLIENT_SECRET:tu-client-secret-linkedin}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: LinkedIn
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            user-name-attribute: sub

