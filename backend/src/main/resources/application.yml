# Brevo Transactional Email
brevo:
  api-key: ${BREVO_API_KEY:}
  enabled: ${BREVO_ENABLED:false}
  sender:
    name: ${BREVO_SENDER_NAME:Caché}
    email: ${BREVO_SENDER_EMAIL:noreply@micache.com}
  template-ids:
    otp-verification: ${BREVO_TPL_OTP:1}
    password-reset: ${BREVO_TPL_PASSWORD:3}
    feedback-request: ${BREVO_TPL_FEEDBACK:2}
    feedback-reminder: ${BREVO_TPL_REMINDER:4}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
