version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: root-project-ia-db
    environment:
      POSTGRES_DB: root_ia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
