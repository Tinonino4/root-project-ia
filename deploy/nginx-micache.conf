server {
    listen 80;
    server_name micache.es www.micache.es 37.27.197.244;
    return 301 https://micache.es$request_uri;
}

server {
    listen 443 ssl;
    server_name micache.es www.micache.es;

    ssl_certificate /etc/letsencrypt/live/micache.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micache.es/privkey.pem;

    # Configuración de seguridad SSL optimizada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Frontend Estático
    location / {
        root /var/www/micache;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para el Backend (API)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Avatares / Subidas estáticas (Servidos directamente por Nginx)
    location /uploads/ {
        alias /var/web/micache/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
