server {
    listen 80;
    server_name micache.es www.micache.es 37.27.197.244;
    return 301 https://www.micache.es$request_uri;
}

# Redirigir de https://micache.es a https://www.micache.es
server {
    listen 443 ssl;
    server_name micache.es;

    ssl_certificate /etc/letsencrypt/live/micache.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micache.es/privkey.pem;

    # Configuración de seguridad SSL optimizada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://www.micache.es$request_uri;
}

# Servidor principal para https://www.micache.es
server {
    listen 443 ssl;
    server_name www.micache.es;

    ssl_certificate /etc/letsencrypt/live/micache.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micache.es/privkey.pem;

    # Configuración de seguridad SSL optimizada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Frontend Estático
    location / {
        root /var/www/micache;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos con hash (Vite)
    location /assets/ {
        root /var/www/micache;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy para el Backend (API)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect OAuth2 al Frontend (ruta Vue, no backend)
    location /oauth2/redirect {
        root /var/www/micache;
        try_files /index.html =404;
    }

    # Proxy para OAuth2 (Inicio de sesión social)
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://127.0.0.1:8080/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Avatares / Subidas estáticas (Servidos directamente por Nginx)
    location /uploads/ {
        alias /var/web/micache/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
